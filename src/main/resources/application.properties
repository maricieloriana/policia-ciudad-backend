spring.application.name=policia-ciudad-backend
# Conexion con MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/policia_ciudad

# Comprueba que las tablas coincidan con las entidades sin modificarlas
spring.jpa.hibernate.ddl-auto=validate
# (Por ahora Hibernate no crea ni modifica tablas
#spring.jpa.hibernate.ddl-auto=none
#evita cambios autom\u00e1ticos en las tablas durante esta comprobaci\u00f3n)


# Las operaciones con datos se realizaran en la capa de servicio
spring.jpa.open-in-view=false
#desactiva mantener la sesi\u00f3n de persistencia abierta durante toda la solicitud web

# Carga el usuario y la contrase\u00f1a de esta computadora
spring.config.import=optional:classpath:application-local.properties

spring.profiles.active=carga-inicial