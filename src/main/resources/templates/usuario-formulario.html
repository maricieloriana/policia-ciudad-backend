<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crear cuenta | Policía de la Ciudad</title>
    <link rel="stylesheet" th:href="@{/css/estilos.css}">
    <script th:src="@{/js/sesion.js}"
            th:attr="data-csrf=@{/sesion/csrf},
            data-logout=@{/logout},
            data-login=@{/login}"
            defer>
    </script>
</head>
<body>
    <header>
        <h1>Crear cuenta de usuario</h1>
        <a th:href="@{/inicio}">Volver al inicio</a>
    </header>

    <main>
        <h2>Datos de acceso</h2>

        <p th:if="${mensajeExito}"
           th:text="${mensajeExito}"
           role="status">
        </p>

        <p th:if="${mensajeError}"
           th:text="${mensajeError}"
           role="alert">
        </p>

        <form th:action="@{/usuarios}"
              th:object="${usuario}"
              method="post">

            <div>
                <label for="idPersona">ID de la persona titular</label>
                <input type="number"
                       id="idPersona"
                       th:field="*{idPersona}"
                       min="1"
                       aria-describedby="ayudaPersona"
                       required>

                <p id="ayudaPersona">
                    Ingresá el ID de una persona existente que todavía
                    no tenga cuenta. Para el rol VIGILANTE,
                    la persona debe estar registrada como vigilante.
                </p>
            </div>

            <div>
                <label for="nombreUsuario">Nombre de usuario</label>
                <input type="text"
                       id="nombreUsuario"
                       th:field="*{nombreUsuario}"
                       maxlength="255"
                       autocomplete="off"
                       required>
            </div>

            <div>
                <label for="contrasenia">Contraseña</label>
                <input type="password"
                       id="contrasenia"
                       name="contrasenia"
                       minlength="8"
                       autocomplete="new-password"
                       aria-describedby="ayudaContrasenia"
                       required>

                <p id="ayudaContrasenia">
                    Ingresá al menos 8 caracteres.
                </p>
            </div>

            <div>
                <label for="rol">Rol</label>
                <select id="rol" th:field="*{rol}" required>
                    <option value="">Seleccioná un rol</option>
                    <option th:each="rolDisponible : ${roles}"
                            th:value="${rolDisponible}"
                            th:text="${rolDisponible}">
                    </option>
                </select>
            </div>

            <button type="submit">Crear cuenta</button>
        </form>
    </main>
</body>
</html>
