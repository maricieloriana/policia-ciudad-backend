<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Personas detenidas | Policía de la Ciudad</title>
    <link rel="stylesheet" th:href="@{/css/estilos.css}">
    <script th:src="@{/js/sesion.js}"
            th:attr="data-csrf=@{/sesion/csrf},
            data-logout=@{/logout},
            data-login=@{/login}"
            defer>
    </script>
</head>
<body>
    <header>
        <h1>Personas detenidas</h1>
        <a th:href="@{/inicio}">Volver al inicio</a>
    </header>

    <main>
        <h2>Personas detenidas registradas</h2>
        <p th:if="${esAdministrador}">
            <a class="boton" th:href="@{/personas-detenidas/nueva}">
                Registrar persona detenida
            </a>
        </p>

        <p th:if="${mensajeExito}"
           th:text="${mensajeExito}"
           role="status">
        </p>

        <p th:if="${mensajeError}"
           th:text="${mensajeError}"
           role="alert">
        </p>

        <p th:if="${#lists.isEmpty(personasDetenidas)}">
            No hay personas detenidas registradas.
        </p>

        <div class="tabla-contenedor">
<table th:unless="${#lists.isEmpty(personasDetenidas)}">
            <caption>Datos de las personas detenidas registradas</caption>

            <thead>
                <tr>
                    <th scope="col">ID</th>
                    <th scope="col">Nombre completo</th>
                    <th scope="col">DNI</th>
                    <th scope="col">Nacimiento</th>
                    <th scope="col">Edad</th>
                    <th scope="col">Mail</th>
                    <th scope="col">Teléfono</th>
                    <th scope="col">Banda</th>
                    <th scope="col" th:if="${esAdministrador}">Acciones</th>
                </tr>
            </thead>

            <tbody>
                <tr th:each="persona : ${personasDetenidas}">
                    <td th:text="${persona.id}"></td>
                    <td th:text="${persona.nombreCompleto}"></td>
                    <td th:text="${persona.dni ?: 'Sin informar'}"></td>

                    <td th:text="${persona.fechaNacimiento != null
                        ? #temporals.format(persona.fechaNacimiento, 'dd/MM/yyyy')
                        : 'Sin informar'}"></td>

                    <td th:text="${persona.edad != null
                        ? persona.edad : 'Sin informar'}"></td>

                    <td th:text="${persona.mail ?: 'Sin informar'}"></td>
                    <td th:text="${persona.telefono ?: 'Sin informar'}"></td>

                    <td th:text="${persona.numeroBanda != null
                        ? persona.numeroBanda : 'Sin banda'}"></td>

                    <td class="acciones-celda" th:if="${esAdministrador}">
                        <div class="acciones">
                            <a class="boton" th:href="@{/personas-detenidas/{id}/nombre(id=${persona.id})}">
                                Editar nombre
                            </a>

                            <a class="boton" th:href="@{/personas-detenidas/{id}/banda(id=${persona.id})}">
                                Cambiar banda
                            </a>

                            <form
                                th:action="@{/personas-detenidas/{id}/eliminar(id=${persona.id})}"
                                method="post"
                                onsubmit="return confirm('¿Querés eliminar esta persona detenida?');">
                                <button type="submit">Eliminar</button>
                            </form>
                        </div>
                    </td>
                </tr>
            </tbody>
        </table>
        </div>
    </main>
</body>
</html>
