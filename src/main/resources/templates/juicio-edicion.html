<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar juicio | Policía de la Ciudad</title>
    <link rel="stylesheet" th:href="@{/css/estilos.css}">
    
</head>
<body>
    <header>
        <h1>Editar resolución</h1>
        <a th:href="@{/juicios}">Volver a la lista</a>
    </header>

    <main>
        <h2 th:text="${'Juicio — ID ' + idJuicio}">Datos del juicio</h2>

        <p th:if="${mensajeError}"
           th:text="${mensajeError}"
           role="alert">
        </p>

        <form th:action="@{/juicios/{id}/editar(id=${idJuicio})}"
              th:object="${juicio}"
              method="post">

            <div>
                <label for="condenado">Resolución</label>
                <select id="condenado"
                        th:field="*{condenado}"
                        required>
                    <option value="">Seleccioná una resolución</option>
                    <option value="true">Condena</option>
                    <option value="false">Absolución</option>
                </select>
            </div>

            <div>
                <label for="aniosCarcel">Años de cárcel</label>
                <input type="number"
                       id="aniosCarcel"
                       th:field="*{aniosCarcel}"
                       min="0"
                       aria-describedby="ayudaAnios"
                       required>

                <p id="ayudaAnios">
                    Para una absolución ingresá 0.
                    Para una condena ingresá una cantidad mayor que 0.
                </p>
            </div>

            <div class="acciones">
                <button type="submit">Guardar cambios</button>
                <a class="boton" th:href="@{/juicios}">Cancelar</a>
            </div>
        </form>
    </main>
</body>
</html>
