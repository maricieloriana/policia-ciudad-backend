<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Juicios | Policía de la Ciudad</title>
    <link rel="stylesheet" th:href="@{/css/estilos.css}">
   
</head>
<body>
    <header>
        <h1>Juicios</h1>
        <a th:href="@{/inicio}">Volver al inicio</a>
    </header>

    <main>
        <h2>Juicios registrados</h2>
        <p th:if="${esAdministrador}">
            <a class="boton" th:href="@{/juicios/nuevo}">Registrar juicio</a>
        </p>

        <p th:if="${mensajeExito}"
           th:text="${mensajeExito}"
           role="status">
        </p>

        <p th:if="${mensajeError}"
           th:text="${mensajeError}"
           role="alert">
        </p>

        <p th:if="${#lists.isEmpty(juicios)}">
            No hay juicios registrados.
        </p>

        <div class="tabla-contenedor">
            <table th:unless="${#lists.isEmpty(juicios)}">
                <caption>Datos de los juicios registrados</caption>

                <thead>
                    <tr>
                        <th scope="col">ID</th>
                        <th scope="col">ID del asalto</th>
                        <th scope="col">ID de persona detenida</th>
                        <th scope="col">ID del juez</th>
                        <th scope="col">Resolución</th>
                        <th scope="col">Años de cárcel</th>
                        <th scope="col" th:if="${esAdministrador}">Acciones</th>
                    </tr>
                </thead>

                <tbody>
                    <tr th:each="juicio : ${juicios}">
                        <td th:text="${juicio.id}">1</td>
                        <td th:text="${juicio.idAsalto}">1</td>
                        <td th:text="${juicio.idPersonaDetenida}">7</td>
                        <td th:text="${juicio.idJuez}">6</td>

                        <td th:text="${juicio.condenado
                            ? 'Condena' : 'Absolución'}">
                            Condena
                        </td>

                        <td th:text="${juicio.aniosCarcel}">5</td>

                        <td class="acciones-celda" th:if="${esAdministrador}">
                            <div class="acciones">
                                <a class="boton" th:href="@{/juicios/{id}/editar(id=${juicio.id})}">
                                    Editar resolución
                                </a>

                                <form
                                    th:action="@{/juicios/{id}/eliminar(id=${juicio.id})}"
                                    method="post"
                                    onsubmit="return confirm('¿Querés eliminar este juicio?');">
                                    <button type="submit">Eliminar</button>
                                </form>
                            </div>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </main>
</body>
</html>
