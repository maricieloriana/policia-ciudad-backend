<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar sucursal | Policía de la Ciudad</title>
    <link rel="stylesheet" th:href="@{/css/estilos.css}">
    <script th:src="@{/js/sesion.js}"
            th:attr="data-csrf=@{/sesion/csrf},
            data-logout=@{/logout},
            data-login=@{/login}"
            defer>
    </script>
</head>
<body>
    <header>
        <h1>Editar sucursal</h1>
        <a th:href="@{/sucursales}">Volver a la lista</a>
    </header>

    <main>
        <h2 th:text="${'Sucursal ' + codigoSucursal}">
            Datos de la sucursal
        </h2>

        <p th:if="${mensajeError}"
           th:text="${mensajeError}"
           role="alert">
        </p>

        <form
            th:action="@{/sucursales/{codigo}/editar(codigo=${codigoSucursal})}"
            th:object="${sucursal}"
            method="post">

            <div>
                <label for="domicilio">Domicilio</label>
                <input type="text"
                       id="domicilio"
                       th:field="*{domicilio}"
                       maxlength="255"
                       required>
            </div>

            <div>
                <label for="cantidadEmpleados">
                    Cantidad de empleados
                </label>
                <input type="number"
                       id="cantidadEmpleados"
                       th:field="*{cantidadEmpleados}"
                       min="0"
                       required>
            </div>

            <button type="submit">Guardar cambios</button>
        </form>
    </main>
</body>
</html>
