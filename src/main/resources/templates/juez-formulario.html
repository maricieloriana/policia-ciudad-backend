<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registrar juez | Policía de la Ciudad</title>
    <link rel="stylesheet" th:href="@{/css/estilos.css}">
   
</head>
<body>
    <header>
        <h1>Registrar juez</h1>
        <a th:href="@{/jueces}">Volver a la lista</a>
    </header>

    <main>
        <h2>Datos del juez</h2>

        <p th:if="${mensajeError}"
           th:text="${mensajeError}"
           role="alert">
        </p>

        <form th:action="@{/jueces}"
              th:object="${juez}"
              method="post">

            <div>
                <label for="nombreCompleto">Nombre completo</label>
                <input type="text"
                       id="nombreCompleto"
                       th:field="*{nombreCompleto}"
                       maxlength="255"
                       required>
            </div>

            <div>
                <label for="claveInterna">Clave interna</label>
                <input type="number"
                       id="claveInterna"
                       th:field="*{claveInterna}"
                       min="1"
                       required>
            </div>

            <div>
                <label for="aniosServicio">Años de servicio</label>
                <input type="number"
                       id="aniosServicio"
                       th:field="*{aniosServicio}"
                       min="0"
                       required>
            </div>

            <div class="acciones">
                <button type="submit">Guardar juez</button>
                <a class="boton" th:href="@{/jueces}">Cancelar</a>
            </div>
        </form>
    </main>
</body>
</html>
