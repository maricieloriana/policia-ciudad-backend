<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registrar persona detenida | Policía de la Ciudad</title>
    <link rel="stylesheet" th:href="@{/css/estilos.css}">
    <script th:src="@{/js/sesion.js}"
            th:attr="data-csrf=@{/sesion/csrf},
            data-logout=@{/logout},
            data-login=@{/login}"
            defer>
    </script>
</head>
<body>
    <header>
        <h1>Registrar persona detenida</h1>
        <a th:href="@{/personas-detenidas}">Volver a la lista</a>
    </header>

    <main>
        <h2>Datos de la persona</h2>

        <p th:if="${mensajeError}"
           th:text="${mensajeError}"
           role="alert">
        </p>

        <form th:action="@{/personas-detenidas}"
              th:object="${persona}"
              method="post">

            <div>
                <label for="nombre">Nombre</label>
                <input type="text" th:field="*{nombre}"
                       maxlength="100" required>
            </div>

            <div>
                <label for="apellido">Apellido</label>
                <input type="text" th:field="*{apellido}"
                       maxlength="100" required>
            </div>

            <div>
                <label for="dni">DNI</label>
                <input type="text" th:field="*{dni}"
                       inputmode="numeric"
                       pattern="[0-9]{8}"
                       minlength="8" maxlength="8"
                       title="Ingresá exactamente 8 dígitos, sin puntos."
                       required>
            </div>

            <div>
                <label for="fechaNacimiento">Fecha de nacimiento</label>
                <input type="date" th:field="*{fechaNacimiento}" required>
            </div>

            <div>
                <label for="mail">Mail</label>
                <input type="email" th:field="*{mail}"
                       maxlength="254" required>
            </div>

            <div>
                <label for="telefono">Teléfono</label>
                <input type="tel" th:field="*{telefono}"
                       maxlength="30" required>
            </div>

            <p>La edad se calcula automáticamente desde la fecha de nacimiento.</p>

            <div>
                <label for="numeroBanda">Banda</label>
                <select id="numeroBanda" th:field="*{numeroBanda}">
                    <option value="">Sin banda</option>
                    <option th:each="banda : ${bandas}"
                            th:value="${banda.numero}"
                            th:text="${'Banda ' + banda.numero}">
                    </option>
                </select>
            </div>

            <div class="acciones">
                <button type="submit">Guardar persona</button>
                <a class="boton" th:href="@{/personas-detenidas}">Cancelar</a>
            </div>
        </form>
    </main>
</body>
</html>
