<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vigilantes | Policía de la Ciudad</title>
    <link rel="stylesheet" th:href="@{/css/estilos.css}">
</head>
<body>

    <header>
        <h1>Vigilantes</h1>
        <a th:href="@{/inicio}">Volver al inicio</a>
    </header>

    <main>
        <h2>Vigilantes registrados</h2>
        
        <!-- Solo el administrador ve la opción de registrar -->
        <p th:if="${esAdministrador}">
            <a th:href="@{/vigilantes/nuevo}">Registrar vigilante</a>
        </p>
        
        <!-- Confirma el registro después de volver a la lista -->
        <p th:if="${mensajeExito}"
           th:text="${mensajeExito}"
           role="status">
        </p>

        <!-- Informa cuando no hay registros -->
        <p th:if="${#lists.isEmpty(vigilantes)}">
            No hay vigilantes registrados.
        </p>

        <table th:unless="${#lists.isEmpty(vigilantes)}">
            <caption>Datos de los vigilantes registrados</caption>

            <thead>
                <tr>
                    <th scope="col">ID</th>
                    <th scope="col">Nombre completo</th>
                    <th scope="col">Edad</th>
                    <th scope="col" th:if="${esAdministrador}">Acciones</th>
                </tr>
            </thead>

            <tbody>
                <!-- Genera una fila por cada vigilante -->
                <tr th:each="vigilante : ${vigilantes}">
                    <td th:text="${vigilante.id}">1</td>
                    <td th:text="${vigilante.nombreCompleto}">Nombre</td>
                    <td th:text="${vigilante.edad}">30</td>
                    <td th:if="${esAdministrador}">
                        <a th:href="@{/vigilantes/{id}/editar(id=${vigilante.id})}">
                            Editar
                        </a>
                    </td>
                </tr>
            </tbody>
        </table>
    </main>

</body>
</html>
