<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar juez | Policía de la Ciudad</title>
    <link rel="stylesheet" th:href="@{/css/estilos.css}">
</head>
<body>
    <header>
        <h1>Editar juez</h1>
        <a th:href="@{/jueces}">Volver a la lista</a>
    </header>

    <main>
        <h2 th:text="${'Juez — ID ' + idJuez}">Datos del juez</h2>

        <p th:if="${mensajeError}"
           th:text="${mensajeError}"
           role="alert">
        </p>

        <form th:action="@{/jueces/{id}/editar(id=${idJuez})}"
              th:object="${juez}"
              method="post">

            <div>
                <label for="nombreCompleto">Nombre completo</label>
                <input type="text"
                       id="nombreCompleto"
                       th:field="*{nombreCompleto}"
                       maxlength="255"
                       required>
            </div>

            <div>
                <label for="aniosServicio">Años de servicio</label>
                <input type="number"
                       id="aniosServicio"
                       th:field="*{aniosServicio}"
                       min="0"
                       required>
            </div>

            <button type="submit">Guardar cambios</button>
        </form>
    </main>
</body>
</html>
