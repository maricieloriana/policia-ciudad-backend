<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${idVigilante != null}
            ? 'Editar vigilante | Policía de la Ciudad'
            : 'Registrar vigilante | Policía de la Ciudad'">
         Vigilante
    </title>
    <link rel="stylesheet" th:href="@{/css/estilos.css}">
    <script th:src="@{/js/sesion.js}"
            th:attr="data-csrf=@{/sesion/csrf},
            data-logout=@{/logout},
            data-login=@{/login}"
            defer>
    </script>
</head>
<body>

    <header>
        <h1 th:text="${idVigilante != null}
            ? 'Editar vigilante'
            : 'Registrar vigilante'">
            Vigilante
        </h1>
        <a th:href="@{/vigilantes}">Volver a la lista</a>
    </header>

    <main>
        <!-- Muestra los errores que informe el controlador -->
        <p th:if="${mensajeError}"
           th:text="${mensajeError}"
           role="alert">
        </p>

        <!-- El destino cambia según sea un registro o una edición -->
        <form th:action="${idVigilante != null}
              ? @{/vigilantes/{id}/editar(id=${idVigilante})}
              : @{/vigilantes}"
              th:object="${vigilante}"
              method="post">

            <!-- Campos para registrar un vigilante -->
            <div>
                <div>
                    <label for="nombre">Nombre</label>
                    <input type="text"
                           th:field="*{nombre}"
                           maxlength="100"
                           required>
                </div>

                <div>
                    <label for="apellido">Apellido</label>
                    <input type="text"
                           th:field="*{apellido}"
                           maxlength="100"
                           required>
                </div>

                <div>
                    <label for="dni">DNI</label>
                    <input type="text"
                           th:field="*{dni}"
                           inputmode="numeric"
                           pattern="[0-9]{8}"
                           minlength="8"
                           maxlength="8"
                           title="Ingresá exactamente 8 dígitos, sin puntos."
                           required>
                </div>

                <div>
                    <label for="fechaNacimiento">Fecha de nacimiento</label>
                    <input type="date"
                           th:field="*{fechaNacimiento}"
                           required>
                </div>

                <div>
                    <label for="mail">Mail</label>
                    <input type="email"
                           th:field="*{mail}"
                           maxlength="254"
                           required>
                </div>

                <div>
                    <label for="telefono">Teléfono</label>
                    <input type="tel"
                           th:field="*{telefono}"
                           maxlength="30"
                           required>
                </div>

                <p>La edad se calcula automáticamente desde la fecha de nacimiento.</p>
            </div>

            <div class="acciones">
                <button type="submit"
                    th:text="${idVigilante != null}
                    ? 'Guardar cambios'
                    : 'Guardar vigilante'">
                Guardar
            </button>
                <a class="boton" th:href="@{/vigilantes}">Cancelar</a>
            </div>
        </form>
    </main>

</body>
</html>
