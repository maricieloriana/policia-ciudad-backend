<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar nombre | Policía de la Ciudad</title>
    <link rel="stylesheet" th:href="@{/css/estilos.css}">
    <script th:src="@{/js/sesion.js}"
            th:attr="data-csrf=@{/sesion/csrf},
            data-logout=@{/logout},
            data-login=@{/login}"
            defer>
    </script>
</head>
<body>
    <header>
        <h1>Editar nombre</h1>
        <a th:href="@{/personas-detenidas}">Volver a la lista</a>
    </header>

    <main>
        <h2 th:text="${'Persona detenida — ID ' + idPersona}">
            Persona detenida
        </h2>

        <p th:if="${mensajeError}"
           th:text="${mensajeError}"
           role="alert">
        </p>

        <form
            th:action="@{/personas-detenidas/{id}/nombre(id=${idPersona})}"
            th:object="${persona}"
            method="post">

            <div>
                <label for="nombreCompleto">Nombre completo</label>
                <input type="text"
                       id="nombreCompleto"
                       th:field="*{nombreCompleto}"
                       maxlength="255"
                       required>
            </div>

            <div class="acciones">
                <button type="submit">Guardar cambios</button>
                <a class="boton" th:href="@{/personas-detenidas}">Cancelar</a>
            </div>
        </form>
    </main>
</body>
</html>
