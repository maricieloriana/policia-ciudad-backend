<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bandas | Policía de la Ciudad</title>
    <link rel="stylesheet" th:href="@{/css/estilos.css}">
    
</head>
<body>
    <header>
        <h1>Bandas</h1>
        <a th:href="@{/inicio}">Volver al inicio</a>
    </header>

    <main>
        <h2>Bandas registradas</h2>
        <p th:if="${esAdministrador}">
            <a class="boton" th:href="@{/bandas/nueva}">Registrar banda</a>
        </p>

        <p th:if="${mensajeExito}"
           th:text="${mensajeExito}"
           role="status">
        </p>        
        <p th:if="${mensajeError}"
           th:text="${mensajeError}"
           role="alert">
        </p>

        <p th:if="${#lists.isEmpty(bandas)}">
            No hay bandas registradas.
        </p>

        <div class="tabla-contenedor">
<table th:unless="${#lists.isEmpty(bandas)}">
            <caption>Datos de las bandas registradas</caption>

            <thead>
                <tr>
                    <th scope="col">Número de banda</th>
                    <th scope="col">Cantidad de miembros</th>
                    <th scope="col" th:if="${esAdministrador}">Acciones</th>
                </tr>
            </thead>

            <tbody>
                <tr th:each="banda : ${bandas}">
                    <td th:text="${banda.numero}">100</td>
                    <td th:text="${banda.cantidadMiembros}">6</td>

                    <td class="acciones-celda" th:if="${esAdministrador}">
                        <div class="acciones">
                        <a class="boton" th:href="@{/bandas/{numero}/editar(numero=${banda.numero})}">
                            Editar
                        </a>

                        <form
                            th:action="@{/bandas/{numero}/eliminar(numero=${banda.numero})}"
                            method="post"
                            onsubmit="return confirm('¿Querés eliminar esta banda?');">

                            <button type="submit">Eliminar</button>
                        </form>
                    
                        </div>
                    </td>
                </tr>
            </tbody>
        </table>
        </div>
    </main>
</body>
</html>
