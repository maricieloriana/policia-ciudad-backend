<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cambiar banda | Policía de la Ciudad</title>
    <link rel="stylesheet" th:href="@{/css/estilos.css}">
    
</head>
<body>
    <header>
        <h1>Cambiar banda</h1>
        <a th:href="@{/personas-detenidas}">Volver a la lista</a>
    </header>

    <main>
        <h2 th:text="${'Persona detenida — ID ' + idPersona}">
            Persona detenida
        </h2>

        <p th:if="${mensajeError}"
           th:text="${mensajeError}"
           role="alert">
        </p>

        <form
            th:action="@{/personas-detenidas/{id}/banda(id=${idPersona})}"
            th:object="${persona}"
            method="post">

            <div>
                <label for="numeroBanda">Banda</label>
                <select id="numeroBanda" th:field="*{numeroBanda}">
                    <option value="">Sin banda</option>
                    <option th:each="banda : ${bandas}"
                            th:value="${banda.numero}"
                            th:text="${'Banda ' + banda.numero}">
                    </option>
                </select>
            </div>

            <div class="acciones">
                <button type="submit">Guardar cambios</button>
                <a class="boton" th:href="@{/personas-detenidas}">Cancelar</a>
            </div>
        </form>
    </main>
</body>
</html>
