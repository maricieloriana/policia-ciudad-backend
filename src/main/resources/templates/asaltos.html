<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Asaltos | Policía de la Ciudad</title>
    <link rel="stylesheet" th:href="@{/css/estilos.css}">
    <script th:src="@{/js/sesion.js}"
            th:attr="data-csrf=@{/sesion/csrf},
            data-logout=@{/logout},
            data-login=@{/login}"
            defer>
    </script>
</head>
<body>
    <header>
        <h1>Asaltos</h1>
        <a th:href="@{/inicio}">Volver al inicio</a>
    </header>

    <main>
        <h2>Asaltos registrados</h2>
        <p th:if="${esAdministrador}">
            <a class="boton" th:href="@{/asaltos/nuevo}">Registrar asalto</a>
        </p>

        <p th:if="${mensajeExito}"
           th:text="${mensajeExito}"
           role="status">
        </p>

        <p th:if="${mensajeError}"
           th:text="${mensajeError}"
           role="alert">
        </p>

        <p th:if="${#lists.isEmpty(asaltos)}">
            No hay asaltos registrados.
        </p>

        <div class="tabla-contenedor">
<table th:unless="${#lists.isEmpty(asaltos)}">
            <caption>Datos de los asaltos registrados</caption>

            <thead>
                <tr>
                    <th scope="col">ID</th>
                    <th scope="col">Sucursal</th>
                    <th scope="col">ID de persona detenida</th>
                    <th scope="col">Fecha</th>
                    <th scope="col" th:if="${esAdministrador}">Acciones</th>
                </tr>
            </thead>

            <tbody>
                <tr th:each="asalto : ${asaltos}">
                    <td th:text="${asalto.id}">1</td>
                    <td th:text="${asalto.codigoSucursal}">2001</td>
                    <td th:text="${asalto.idPersonaDetenida}">7</td>
                    <td th:text="${asalto.fecha}">2026-10-18</td>

                    <td class="acciones-celda" th:if="${esAdministrador}">
                        <div class="acciones">
                            <a class="boton" th:href="@{/asaltos/{id}/editar(id=${asalto.id})}">
                                Editar fecha
                            </a>

                            <form
                                th:action="@{/asaltos/{id}/eliminar(id=${asalto.id})}"
                                method="post"
                                onsubmit="return confirm('¿Querés eliminar este asalto?');">
                                <button type="submit">Eliminar</button>
                            </form>
                        </div>
                    </td>
                </tr>
            </tbody>
        </table>
        </div>
    </main>
</body>
</html>
